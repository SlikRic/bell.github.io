  // Fonction qui permet de fermer la vidéo 
  function closeVideo(id) {
    // 1. Pause the active video element
   document.getElementById(id).pause();
    if (document.getElementById(id).webkitExitFullscreen) {
	    document.getElementById(id).webkitExitFullscreen();
	} else if (document.exitFullscreen && document.fullscreenElement === document.getElementById(id)) {
	    document.exitFullscreen();
	}

    var hypeDoc = HYPE.documents['index'];
    
    // 2. Go back to your Main Scene
    hypeDoc.showSceneNamed('Main');

    // 3. Jump back to the exact second we saved
    if (typeof window.savedCarouselTime !== 'undefined') {
        hypeDoc.goToTimeInTimelineNamed(window.savedCarouselTime, 'Main Timeline');
        
        // Force the card stacking script to run so the correct card pops to the front instantly
        if (typeof hypeDoc.functions().cardStacking === 'function') {
            hypeDoc.functions().cardStacking(hypeDoc, null, null);
        }
    }

function resetTrackingVariables() {
    tracked_01 = false;
    tracked_25 = false;
    tracked_50 = false;
    tracked_75 = false;
    tracked_100 = false;

}

function trackVideo() {

    videoCursor = vidElm.currentTime;
    videoDuration = vidElm.duration;
    firstMill = 0.01;
    firstQurt = videoDuration / 4;
    secondQurt = firstQurt * 2;
    thirdQurt = firstQurt * 3;

    //position de lecture de la video en secondes et millisecondes.
    //videoPreciseCursor = vidElm.currentTime.toFixed(2);

    trackPerc = vidElm.currentTime * 100 / videoDuration;
    trackPercentage = Math.trunc(trackPerc);

    if (!tracked_01) {
        if (videoCursor >= firstMill) {
            tracked_01 = true;
            console.log("%c _video_01pc", 'color: #009933');
            LP.Pub.Tracking.CustomerEventPublisher.publish('Custom_video_0.01sec');
        }
    }
    
    if (videoCursor >= firstQurt && videoCursor < secondQurt) {
        if (!tracked_25) {
            tracked_25 = true;
            console.log("%c Custom_video_25pc", 'color: #009933');
            LP.Pub.Tracking.CustomerEventPublisher.publish('Custom_video_25pc');
        }
    }
    if (videoCursor >= secondQurt && videoCursor < thirdQurt) {
        if (!tracked_50) {
            tracked_50 = true;
            console.log("%c Custom_video_50pc ", 'color: #009933');
            LP.Pub.Tracking.CustomerEventPublisher.publish('Custom_video_50pc');
        }
    }
    
    if (videoCursor > thirdQurt) {
        if (!tracked_75) {
            tracked_75 = true;
            console.log("%c Custom_video_75pc", 'color: #009933');
            LP.Pub.Tracking.CustomerEventPublisher.publish('Custom_video_75pc');
        }
    }
    
    if (trackPercentage >= 98) {
        if (!tracked_100) {
            tracked_100 = true;
            console.log("%c Custom_video_100pc", 'color: #009933');
            LP.Pub.Tracking.CustomerEventPublisher.publish('Custom_video_100pc');
        }
    }
}
